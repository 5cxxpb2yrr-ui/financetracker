name: FinanceTracker App CI

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "saas.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/finance-app-ci.yml"
  pull_request:
    paths:
      - "app.py"
      - "saas.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/finance-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-config:
    name: Production configuration safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test production secret requirements
        run: python -m unittest discover -s tests -v
